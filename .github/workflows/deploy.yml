name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Redeploy periódicamente para refrescar la bitácora (RSS de Substack).
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Regenera public/blog-feed.json con el RSS de Substack justo antes de compilar.
      # Si el fetch falla, se conserva el blog-feed.json ya versionado como respaldo.
      - name: Refresh blog feed (Substack)
        run: |
          ENCODED_URL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('https://srwatchman.substack.com/feed'))")
          if curl -sf "https://api.rss2json.com/v1/api.json?rss_url=${ENCODED_URL}" -o /tmp/feed.json; then
            STATUS=$(python3 -c "import json; print(json.load(open('/tmp/feed.json')).get('status','error'))")
            if [ "$STATUS" = "ok" ]; then
              cp /tmp/feed.json public/blog-feed.json
              echo "Blog feed actualizado desde Substack."
            else
              echo "Feed con status '$STATUS'; se conserva public/blog-feed.json versionado."
            fi
          else
            echo "No se pudo obtener el feed; se conserva public/blog-feed.json versionado."
          fi

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
